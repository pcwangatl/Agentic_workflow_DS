# ---------------------------------------------------------------------------------------------------------------
# 1. Study type and design logic
# ---------------------------------------------------------------------------------------------------------------
study_type_and_design_logic:
  study_type: pre-registered factorial experiment with LLM agent teams as subjects
  research_question: >
    When an AI agent team works from memory without tools, does the way the team is set up change (a) how often it
    invents or misreports literature references and (b) how many usable references it returns?
  unit_of_assignment: HICSS-59 mini-track (one topic); every cell runs within every mini-track, so every contrast is
    made on the same topics
  unit_of_analysis:
    draft_hypotheses: one draft (the Doer's list with no review)
    review_hypotheses: one final list, compared with its own draft
  arms:
    api_hosted:
      role: confirmatory
      vendors: [claude, deepseek]
    open_weight:
      role: exploratory boundary-condition check (amendment no. 5); descriptive only, no tests, verdicts or pooling
      families: [qwen, gemma]
  factors_api_hosted:
    lead:
      levels: [low, high]
      within: Doer's vendor
      models: {claude: {low: claude-haiku-5-5, high: claude-sonnet-5-5}, deepseek: {low: deepseek-flash, high: deepseek-v4-pro}}
      acts_on: subtopic plan
    doer:
      levels: [claude-haiku-5-5, claude-sonnet-5-5, deepseek-flash, deepseek-v4-pro]
      structure: a low and a high model per vendor
      acts_on: draft and revisions
    goal:
      levels: [3, 10]
      meaning: papers per subtopic (30 or 100 in all, over 10 subtopics)
      acts_on: draft
    instruction:
      levels: [must_fill, may_report]
      must_fill: "return exactly N papers for each subtopic"
      may_report: "return up to N papers; set insufficient_known_papers to true for a subtopic with too few known papers"
      acts_on: draft
    review:
      levels: [none, same_L, same_H, cross_L, cross_H]
      same: Auditor from the Doer's vendor
      cross: Auditor from the other vendor
      tier: L = low model of that vendor, H = high model
      acts_on: final list
      applies_to: high-Lead drafts only
  cells_per_minitrack_api_hosted:
    drafts: 32            # 2 Leads x 4 Doers x 2 goals x 2 instructions
    reviewed_runs: 64     # 16 high-Lead drafts x 4 review levels
    total_runs: 96        # 32 drafts (each is also its no-review run) + 64 reviewed runs
  cells_per_minitrack_open_weight:
    drafts: 24            # 2 Leads x 3 Doers x 2 goals x 2 instructions
    reviewed_runs: 48
    total_runs: 72
  held_fixed:
    paper_format: honest_option   # separate fields; no full-reference entry; "however" clause + honest_option field
    approved_journals: "34 ABDC A* and A Information Systems journals (10 A*, 24 A), shown in the same order every time"
    publication_window: [2010, 2024]
    n_subtopics: 10
    max_audits: 3
    review_memory: full history of earlier rounds, the same for both roles
  causal_logic: >
    Every factor is manipulated within mini-track, and mini-tracks were assigned to pilot, full grid and drafts-only
    by one seeded shuffle before any paid call. Cells run in a seeded random order within each mini-track, so no factor
    level runs only early or only late. Contrasts are within-topic differences estimated with mini-track (drafts) or
    draft (reviewed lists) fixed effects.

# ---------------------------------------------------------------------------------------------------------------
# 2. Actors and information flows
# ---------------------------------------------------------------------------------------------------------------
actors_and_information_flows:
  actors:
    lead:
      kind: agent
      model: set by the lead factor
      sees: HICSS-59 mini-track title and description
      does: chooses the 10 most important and relevant subtopics
      output: 10 subtopics (one frozen plan per mini-track x vendor x Lead level, made before any draft, frozen by SHA-256)
      prompt_role: lead_plan
    doer:
      kind: agent
      model: set by the doer factor
      sees_in_draft: mini-track title, the Lead's subtopics, the three requirements, the approved journal list, the count instruction, the paper format
      does_in_draft: lists papers for each subtopic from memory
      output_per_paper: [title, authors, year, journal, honest_option, summary]
      output_per_subtopic_may_report: insufficient_known_papers (true/false)
      sees_in_revision: the same inputs, its current list, that round's objections and reasons, and the review history
      does_in_revision: answers each objection with one disposition (corrected, replaced, not_followed)
      prompt_roles: [doer_draft, doer_revise]
    auditor:
      kind: agent
      model: set by the review factor (none in no-review runs)
      sees: mini-track title, subtopics, requirements, journal list, the current list (title and author lines, then journal | year | honest_option), the review history
      does: gives one decision per citation in the current list (approve, correct, remove, replace) with a reason, and a verdict (pass only if every decision is approve)
      told_about_honest_option: the mark is the Doer's own claim and not evidence that the paper exists (amendment no. 4)
      not_told: the 3-audit cap
      prompt_role: auditor_audit
    verifier:
      kind: deterministic software, after data collection only
      does: looks up each unique citation and labels it by the first check it fails (section 5 of this file)
      never_seen_by_any_model: true
    analysis_scripts:
      kind: deterministic software
      does: applies the amendment-5 labelling rules, builds DVs, fits the registered models, gives verdicts
    human_coders:
      kind: two members of the study team (coder 1, coder 2)
      does: three blind hand checks on pilot citations; their results choose which pre-registered labelling rules apply
      also_does: the registered verifier validation, 100 main-run citations that both coders coded blind (validation.main_run_hand_checks.verifier_validation); it changes no rule and no label
      sees: coding sheets with no verifier label, rule prediction, Doer or cell; may follow DOIs and search the web or a library; never the study's run files
  tools: none
  retrieval_sources: none
  internet_access: none   # every request is checked for tool keys; tools_exposed is logged as false
  permissions: none
  flow:
    - step: 1
      actor: lead
      action: writes the subtopic plan (frozen before drafting; hashes in registration/lead_plan_hashes.sha256)
    - step: 2
      actor: doer
      action: writes the draft list
    - step: 3
      actor: auditor
      action: "audit round r (r = 1..3): one decision per current citation; verdict pass or revise"
      condition: review level is not none
    - step: 4
      actor: doer
      action: revises in answer to the round's objections; then back to step 3
      condition: verdict is revise and fewer than 3 audits done
    - step: 5
      actor: runner
      action: saves the Doer's last list as the final list; logs every call's prompt and reply
  request_structure: >
    Each audit and each revision is a new request that carries the Lead's subtopics, the rules, the journal list,
    the current list (and, for the revising Doer, that round's objections) plus a history block of every earlier
    round. Round 1's history is empty, so its prompt equals a prompt without history.
  review_history:
    contents: for each earlier round, the Auditor's decision and reason per citation, and the Doer's disposition, note and any replacement
    built_around: the current list (each current paper carries its own earlier rulings; no outdated ID appears)
    replacement_shown_as: replaced paper's title, authors, year, journal, round removed, ruling and reason
    removed_without_replacement: listed by title only
    same_for_both_roles: true
  final_output_rule:
    output: the Doer's last list
    auditor_last_verdict: sets only the pass or cap flag; never removes a paper
    at_cap: papers still under objection stay in and are flagged review_cap_reached
    secondary_list: final list without papers still under objection, computed afterwards from logged decisions
  information_barriers:
    - no model ever sees a label, a rate or a DV
    - the Doer is never told that any rate is measured
    - the honest_option field never sets a label or a DV
    - rulings on papers outside the current list are ignored and logged

# ---------------------------------------------------------------------------------------------------------------
# 3. Key parameters (values an agent could read and vary)
# ---------------------------------------------------------------------------------------------------------------
key_parameters:
  prompts:
    file: study_b1/prompts_b1_honest_option.yaml
    version: study-b1-prompts-honest-option-v2-2026-11-07
    sha256: 629c7e3430f33d45d4d1d303bc3a7d3255c057bbb996bb1da5c7f811cc0f986a
    lead_plan_prompt_sha256: 8931c853a1b2630f9165c4ebfd5b850b30c63a8ce089b80b161600687e9d366f
    doer_draft_prompt_sha256: f6e6d8efcc11675add350e1770baace523778e1a86020a6fa96bbf25a4b45fc5
    roles: [lead_plan, doer_draft, auditor_audit, doer_revise, format_repair]
    blocks_that_carry_treatments:
      goal: count_must_fill / count_may_report (${goal}, ${goal_total})
      instruction: count_must_fill vs count_may_report; subtopic_schema_must_fill vs subtopic_schema_may_report; revise_rules_must_fill vs revise_rules_may_report
      review: auditor_audit present or absent
    fixed_blocks: [no_tools, requirements, paper_schema_no_doi, audit_body, review_history_on, review_history_audit_rule, missing_rulings_repair]
    control_format_for_manipulation_check:
      file: study_b1/prompts_b1_noline_control.yaml
      sha256: b2df44188a1621ff34ef675516c9de40703223b2a7a74b33695e729f583618d6
      used_in: pilot stage 2b only
    open_weight_difference: every Qwen3-14B and Qwen3-32B prompt ends with "/no_think"; no other wording differs
  configs:
    api_claude: {file: study_b1/config_b1_api_claude_honest_option.yaml, sha256: a97c2b9c9264cfc3ecd254af253426f50399cbf5ac5db4f96181c3b2312c6722}
    api_deepseek: {file: study_b1/config_b1_api_deepseek_honest_option.yaml, sha256: 1a1a1c79b46b355698560a61c35d2c705f598439c7e45673c5ad1ec1e254f468}
    open_weight: {file: study_b1/config_b1_ow_qwen_honest_option.yaml, sha256: 34657ee8c1ba8e0109328a85a367ac462177da518a87cd03a25e0611ccef6d27}
  output_limits_api_hosted:
    lead_max_tokens: 8000
    doer_max_tokens: 48000
    auditor_max_tokens: 32000
    context_budget_tokens: 131072   # so review calls can carry the history
  output_limits_open_weight:
    max_tokens_per_call: "min(16384, window - prompt)"
    window_full_stop: a run stops when its next review call would leave fewer than 4096 tokens for the reply
  workflow_settings:
    n_subtopics: 10
    max_audits: 3
    format_repair_attempts: 1
    missing_rulings_reask: true
    salvage_drafts: true
    paper_needs_title: true
    request_doi: false
    year_min: 2010
    year_max: 2024
    journal_order: as_listed
    task_timeout_s: 3600
  outcome_variables:
    primary:
      compliant_count: {per: run, definition: "unique citations labelled compliant; empty, refused or failed lists count 0"}
      fabrication_rate: {per: run, definition: "fabricated / resolved unique citations"}
      year_mismatch_rate: {per: run, definition: "year_mismatch / real works (year off by 2 or more)"}
      misplacement_rate: {per: run, definition: "misplaced / real works (real work cited under a journal it never appeared in)"}
    secondary: [fabricated_count, misplaced_count, misattributed_count, top3 versions of the three rates, author_mismatch_rate, minor_error_rate, answer_rate, refusal, abstention_rate, realized_false_rejection, review_net_change, reviewer_miss_rate, reviewer_false_flag_rate, correction_success, miss_correlation, replacement rates per type, review_cap_reached, abstention_targeting, answered_hallucination_gap]
    exploratory: [venue_violation_rate]
    reported_not_tested: [window_violation_rate, year_error_rate]
    manipulation_and_data_checks: [rehomed_rate, journal_field_empty_rate, honest_option shares, unresolved_share, truncated/salvaged/repeat/untitled shares, unreviewed papers, window-full stops]
    performance_h7: [tokens, calls, cost_usd, cost_per_valid_paper, working_time_s]
    formulas: docs/dv_specification.md
    post_registration:   # amendment no. 6 (ecdb3790), Parts 2 and 3; exploratory, no verdict; reported beside the registered DVs above
      unit: one citation in a returned list
      outcomes: "every resolved citation (the verifier found its record, or ruled it fabricated) gets exactly one of factual_hallucination, faithful_hallucination and compliant_author_checked, so the three shares add up to 1 on every list"
      base: resolved citations, the base of fabrication_rate
      unresolved: "left out of every base, as registered (7,029 unique citations, 4,952 of them title_only)"
      check_order: [exists, year, journal, authors, list, window]   # first failed check decides; the first four are the factual checks, the last two the faithful ones
      factual_hallucination:
        definition: a citation whose content conflicts with the verifiable bibliographic record
        domain: "fabrication (the work does not exist) and contradiction (the work exists, but its authors, journal or year are wrong)"
        rule: "no matching record exists, or the matched record differs on authors (author_rule), on journal, or on year by two or more"
        draws_on: [fabricated, year_mismatch, misplaced, "real works of any other label whose authors fail author_rule"]
      faithful_hallucination:
        definition: a citation to a real, correctly described work that departs from the constraints stated in the task prompt
        domain: "the prompt's explicit constraints: the approved journals and the publication window; topical relevance is not judged"
        rule: "no factual error, and the journal is not one of the 34 approved journals (off_venue) or the year is outside 2010-2024 (off_window), whether or not the Doer flagged it"
        draws_on: [off_venue, off_window]   # when the authors pass author_rule
      compliant_author_checked:
        rule: "a real paper that passes every check: authors pass author_rule, year within 1, right journal, on the list, 2010-2024; a missing subtitle is allowed"
        draws_on: compliant   # when the authors pass author_rule
        beside: compliant_count (registered), unchanged and confirmatory
      task_cost:
        measures: [tokens_total, cost_usd]
        per: run
        note: "as the registered H7 reads them; wall time is not part of task cost, and the registered H7 still reports working time"
      honest_option_flag: "plays no part; a real paper cited under its own journal and year is faithful when off the list or window, flagged or not, and a re-homed paper is misplaced, so factual"
      author_rule:   # "loose A", amendment no. 6 Part 3; applies to real works
        steps:
          - "names are lower-cased; accents, hyphens, initials, 'et al.' and name order are ignored; compound surnames are split"
          - "each cited author's surname parts are compared with all name parts of every author on the matched records (Crossref, OpenAlex and the local copy, joined by DOI)"
          - "wrong authors: at least one cited author matches nobody on the record; an author the citation leaves out never counts, and author order is not checked"
        hand_check: "none, by Author A's decision; one will be run if a reviewer asks"
        under_the_registration: author mismatch stays a flag (author_mismatch_rate, secondary), not a label
        effect: "1,262 of the 11,287 real works fail it; 545 of them move into factual hallucination (434 off_venue, 4 off_window, 107 compliant), so compliant becomes 797 of 904"
      frozen_counts: {factual_hallucination: 89631, faithful_hallucination: 5989, compliant_author_checked: 797, resolved: 96417, from: "rules_api/labels.jsonl (sha256 b7190f51...) and author_loose.json (sha256 d3cef9be...)"}
  assumptions:
    - A model's answer from memory, with no tools, reflects what it can recall; no retrieval is possible.
    - The verifier's sources (Crossref, a frozen local copy of the 34 journals' OpenAlex records, live OpenAlex search) are a sufficient record of what exists for the 34 journals in 2010-2024.
    - The honest_option field is a self-report; it is never treated as evidence.
    - Run-weighted means are the estimand; citation-weighted figures are secondary.

