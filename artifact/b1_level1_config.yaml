# ---------------------------------------------------------------------------------------------------------------
# 6. Replication requirements
# ---------------------------------------------------------------------------------------------------------------
replication_requirements:
  runs:
    api_hosted: {full_grid_minitracks: 50, drafts_only_minitracks: 29, drafts: 2528, reviewed_runs: 3200, total_runs: 5728}
    open_weight: {full_grid_minitracks: 50, drafts: 1200, reviewed_runs: 2400, total_runs: 3600}
    pilot: {minitracks: 10, enters_analysis: false}
  randomization:
    minitrack_split: {method: "pool sorted by ID, random.Random(20261107).shuffle", order: "first 10 pilot, next 50 full grid, remaining 29 drafts-only"}
    cell_order: {method: balanced_blocks, seed: 20261030, block_size: 1}
    sample_seed: 20261029
    waves: "waves of 10 mini-tracks in drawn order; wave 1 all full-grid; waves 2-7 six full-grid + four drafts-only; wave 8 the remaining four + five"
    open_weight_request_seed_base: 20261106
    hand_check_draw: {script: draw_handchecks.py, sha256: 33bfef83a7e74e9256e88c103e8ff7f0815435361fed2d5ddc3b9adcae0fa8d5, seed: 20261107}
  exclusion_rules:
    empty_draft: leaves rate DVs; counts 0 in compliant_count; shown in answer_rate
    refusal: the model's answer; recorded, never re-asked; a refused draft is an empty draft; a refusal in review ends the run with the list as it stands, flagged
    readable_reply_at_output_limit: used normally; share reported (amendment no. 1)
    unreadable_cut_off_reply: no repair turn; draft keeps complete papers before the cut (truncated); revision or audit ends the run with the last complete or current list (revise_truncated, review_truncated)
    other_unreadable_reply: one repair turn; draft then salvaged or failed; revision changes nothing; audit ends the run (review_parse_error)
    repeated_paper: only the first appearance counts (title lower-cased, punctuation and spacing removed)
    untitled_paper: counts 0 in compliant_count; left out of rate DVs
    server_or_network_error: retried up to 3 times, never scored; a failed item is rerun once before analysis inside the cap; still failing -> left out and listed by cell
    served_model_mismatch: reply left out and item rerun once; above 1% of calls, collection stops
    incomplete_minitrack: only complete mini-tracks are analysed
    pilot_data: never enter the analysis
  uncertainty:
    primary: CR1 cluster-robust standard errors by mini-track
    secondary: mini-track cluster bootstrap (2000 resamples, seed 20261107)
    unresolved_bounds: both bounds reported for every deciding contrast
  comparability_criterion: >
    A replication matches this study if each hypothesis' estimate falls inside this study's 95% interval, widened by
    the registered run-to-run spread for that Doer and DV (stochastic_variation below).

# ---------------------------------------------------------------------------------------------------------------
# 7. Scope conditions
# ---------------------------------------------------------------------------------------------------------------
scope_conditions:
  holds_for:
    - teams that work from model memory only, with no tools, retrieval or internet
    - information-systems literature; the 34 ABDC A* and A IS journals; publication years 2010-2024
    - the four named API-hosted models at the logged access dates (2026-11-07 to 2026-11-09), with thinking off as configured
    - English prompts in the honest-option format (separate fields, no full-reference entry)
    - HICSS-59 mini-tracks as topics; a Lead-Doer-Auditor team with at most 3 audit rounds and shared review history
  depends_on:
    - the verifier's sources being a sufficient record for the 34 journals (Crossref; local copy; live search for four thinly indexed journals)
    - the amendment-5 labelling rules as selected by the pilot hand checks
    - a single wording per condition (prompt-wording sensitivity is not tested)
  invalidated_or_changed_by:
    - giving any role a search or retrieval tool
    - a model update or a different snapshot behind the same model ID
    - turning thinking or reasoning on
    - a different journal list, field or publication window
    - restoring a full-reference entry in the paper format (in pilot stage 2, dropping it raised fabrication sharply)
    - a different review memory (rounds that see only the current list) or a different audit cap
  known_limits:   # PREREGISTRATION.md section 15
    - run-to-run tolerance covers draft DVs only; review-DV tolerance is not measured in the API-hosted arm
    - prompt-wording sensitivity is not tested
    - API-hosted models take no request seed; Claude models run at provider-default sampling
    - the study format was chosen after failed pilot gates (amendments no. 3 and 4); DeepSeek Flash and DeepSeek V4-Pro are flagged
    - off-list and no-journal misses are labelled fabricated without a live search (about +0.6 points of fabrication_rate in the pilot; measured by the widened check)
    - near misses are settled by a fixed rule; its with-author branch failed its pilot bar (16 of 50), so those citations stay unresolved, and title_only citations stay unresolved (71 of 100 against a bar of 90)
    - the verifier does not expand conference acronyms, so misplacement_rate is overstated for proceedings papers cited under short names (6 of 40 sampled misplaced labels in the pilot venue check)
    - the pilot hand checks are split, not double-coded, so they give no inter-rater statistic
    - the open-weight arm sits at the fabrication ceiling and is descriptive only
    - "post-registration constructs (amendment no. 6): the author_rule has no hand check; one will be run if a reviewer asks"
    - "post-registration constructs: the 4,952 title_only citations stay unresolved, so they are left out of every construct base"
    - "the conference-acronym caveat carries over to the constructs: about 15% of misplaced labels (6 of 40 in the pilot venue check; Wilson 95% interval 7% to 29%) are proceedings papers cited by acronym, so factual hallucination is overstated and faithful hallucination understated by that share (check B2 leaves them out)"
    - "the main-run near-miss hand check was not run (amendment no. 6, Part 7), a deviation from the registration; the pilot check of that branch (50 of 50) remains the evidence for it"

