# ---------------------------------------------------------------------------------------------------------------
# 5. Analytical targets
# ---------------------------------------------------------------------------------------------------------------
analytical_targets:
  arm: api_hosted (the open-weight arm has no hypotheses or verdicts)
  label_check_order: [fabricated, year_mismatch, misplaced, off_venue, off_window, compliant]   # first failed check decides; year before journal
  models:
    D1: {data: "drafts, 79 mini-tracks", fixed_effects: mini-track, terms: "goal 10; may-report; one dummy per Doer but the first; a high-Lead dummy per vendor"}
    D2: {data: "drafts, 79 mini-tracks", terms: "D1 + may-report x goal 10"}
    R1: {data: "the five lists of each high-Lead draft, 50 mini-tracks", fixed_effects: draft, terms: "one dummy per review level (same-L, same-H, cross-L, cross-H) and Doer vendor; no review is the reference"}
    R2: {data: as R1, terms: "R1 + each level-by-vendor dummy x goal 10"}
    estimator: OLS
    standard_errors: CR1, clustered by mini-track, t on G - 1 degrees of freedom
    test: two-sided, raw p < .05, no multiplicity adjustment; stars * .05, ** .01, *** .001
  verdict_rules:
    supported: deciding DV significant in the predicted direction
    not_supported: deciding DV not significant (an acceptable, reported result)
    opposite: deciding DV significant in the other direction
    partly_supported: deciding DV moves as predicted but compliant_count fails its 10% non-inferiority check (lower end of the 90% interval below -10% of the comparison mean); applies to H3, H4a, H6, H8
    h9_rule: "supported if >= 1 of the four primary DVs is significantly better and none worse; mixed if some better and some worse; opposite if only worse; not supported otherwise (false-supported chance about 10%)"
    flagged_doers: every verdict is also reported without DeepSeek Flash and DeepSeek V4-Pro (amendment no. 4) and without any Doer above its rehomed_rate ceiling
  hypotheses:
    - {id: H1, prediction: "higher goals raise fabrication", estimand: "goal 10 minus goal 3, drafts", model: D1, deciding_dv: fabrication_rate, direction: two-sided, status: confirmatory, result: {all_doers: supported, without_flagged_doers: not_supported, detail: analytical_targets.results.per_hypothesis.H1}}
    - {id: H2, prediction: "an Auditor improves the list", estimand: "any Auditor (four levels averaged) minus none, each final list against its own draft", model: R1, deciding_dv: compliant_count, direction: up, status: confirmatory, result: {all_doers: supported, without_flagged_doers: supported, detail: analytical_targets.results.per_hypothesis.H2}}
    - {id: H3, prediction: "an other-vendor Auditor lowers fabrication more than a same-vendor one", estimand: "cross minus same, averaged over tiers and vendors", model: R1, deciding_dv: fabrication_rate, direction: down, named_secondary: realized_false_rejection, status: confirmatory, result: {all_doers: supported, without_flagged_doers: opposite, detail: analytical_targets.results.per_hypothesis.H3}}
    - {id: H4a, prediction: "a more capable Doer lowers fabrication", estimand: "high minus low Doer within vendor, averaged over vendors", model: D1, deciding_dv: fabrication_rate, direction: down, status: confirmatory, result: {all_doers: supported, without_flagged_doers: supported, detail: analytical_targets.results.per_hypothesis.H4a}}
    - {id: H5, prediction: "review helps most at high goals", estimand: "(goal 10 minus 3) x (any Auditor minus none)", model: R2, deciding_dv: fabrication_rate, status: secondary, result: {all_doers: not_supported, without_flagged_doers: not_supported, detail: analytical_targets.results.per_hypothesis.H5}}
    - {id: H6, prediction: "permission to report too few lowers fabrication without losing valid papers", estimand: "may-report minus must-fill, drafts", model: D1, deciding_dv: fabrication_rate, direction: down, joint_condition: "compliant_count non-inferior at a 10% margin (both: supported; fabrication only: partly supported)", status: confirmatory, result: {all_doers: partly_supported, without_flagged_doers: partly_supported, detail: analytical_targets.results.per_hypothesis.H6}}
    - {id: H6x, prediction: "the H6 effect depends on the goal", estimand: "(may-report minus must-fill) at goal 10 minus the same at goal 3", model: D2, deciding_dv: fabrication_rate, direction: two-sided, status: secondary, result: {all_doers: not_supported, without_flagged_doers: not_supported, detail: analytical_targets.results.per_hypothesis.H6x}}
    - {id: H7, prediction: "efficiency: every confirmatory contrast repeated on cost", dvs: [tokens, cost_usd, calls, cost_per_valid_paper, working_time_s], note: "working time not measured for runs with a Batch-API model", status: secondary, result: {verdict: none registered, detail: analytical_targets.results.named_secondaries.h7_cost}}
    - {id: H8, prediction: "a more capable Lead lowers fabrication", estimand: "high minus low Lead within vendor, averaged over vendors", model: D1, deciding_dv: fabrication_rate, direction: down, status: confirmatory, result: {all_doers: supported, without_flagged_doers: partly_supported, detail: analytical_targets.results.per_hypothesis.H8}}
    - {id: H9, prediction: "a higher-tier Auditor improves overall performance more than a lower-tier one", estimand: "high minus low tier, averaged over families and vendors", model: R1, deciding_dvs: {compliant_count: up, fabrication_rate: down, year_mismatch_rate: down, misplacement_rate: down}, verdict_rule: h9_rule, named_secondary: realized_false_rejection, status: confirmatory, result: {all_doers: supported, without_flagged_doers: supported, detail: analytical_targets.results.per_hypothesis.H9}}
  robustness:
    - Poisson for counts (OLS fixed effects kept)
    - fractional logit for rates (mini-track fixed effects with draft factors)
    - mini-track cluster bootstrap, percentile, 2000 resamples, seed 20261107
    - unresolved citations counted all valid, then all fabricated (both bounds reported for every deciding contrast)
    - journal-first check order (sensitivity table)
  manipulation_check:
    measure: rehomed_rate (real papers cited under an approved journal they never appeared in), per Doer
    ceiling: upper end of the 95% cluster-bootstrap interval of the Doer's pilot stage-2b honest-option rehomed_rate
    values: {file: registration/tag2_values.json, sha256: 9f34f529e2a151cea8212d6079d423744b9bc15e7907bc1a36f0513b1444a8f2, rows: 8, selected_row: "author=not_used, noauthor=used, title_only=does_not_join", selected_at: prereg-tag2b}
    ceilings_selected: {claude-haiku-5-5: 0.300, claude-sonnet-5-5: 0.025, deepseek-flash: 0.201, deepseek-v4-pro: 0.146}
    above_ceiling: Doer stays in primary verdicts, flagged; results without it are a sensitivity check
    main_run_rehomed_rate:   # results.json ceiling_check
      claude-haiku-5-5: {rehomed: 82, real: 892, rate: 0.0919, ceiling: 0.3, above_ceiling: false}
      claude-sonnet-5-5: {rehomed: 93, real: 4525, rate: 0.0206, ceiling: 0.0247, above_ceiling: false}
      deepseek-flash: {rehomed: 469, real: 2086, rate: 0.2248, ceiling: 0.2011, above_ceiling: true}
      deepseek-v4-pro: {rehomed: 334, real: 3551, rate: 0.0941, ceiling: 0.1461, above_ceiling: false}
      above_ceiling_doers: [deepseek-flash]
  interpretation_rules:
    - rate DVs read as "when the team answers"; answer_rate, refusal and abstention are reported beside every draft contrast
    - a fall in fabrication bought by fewer valid papers is not full support (partly supported)
    - open-weight results are descriptive and are never pooled with the API-hosted arm
  post_registration:   # amendment no. 6 (ecdb3790), Parts 1, 4 and 5; written after the results
    status: "exploratory: no verdict; reported beside the registered results, never in place of them; each change was written down and dated before it was computed"
    outcomes: key_parameters.outcome_variables.post_registration (the three construct shares, tokens_total and cost_usd)
    models: the registered models and contrasts (D1, D2, R1, R2), on all Doers and without the flagged Doers
    report: "estimates, 95% intervals and raw p, labelled uncorrected; no multiple-comparison adjustment, by Author A's decision (as for the registered tests)"
    registered_hypotheses: "the registered H numbers, deciding DVs, tests and verdict rules do not change; each item keeps its own verdict; a sign flips only where a factor is recoded"
    paper_hypotheses:
      - {id: HP1, construct: "adding an Auditor", item: "any Auditor (four levels averaged) vs none", registered: H2}
      - {id: HP2, construct: "model capability (one construct, three items, one per role)", items: ["item 1: high vs low Doer within vendor (H4a)", "item 2: high vs low Lead within vendor (H8)", "item 3: high vs low Auditor tier (H9)"]}
      - {id: HP3, construct: "task difficulty (one construct, two items, both coded 1 = easier)", items: ["item 1: goal 3 (= 1) vs goal 10 (H1, sign flipped)", "item 2: may-report (= 1) vs must-fill (H6)", "item 1 x item 2 (H6x, sign flipped)"]}
      - {id: HP4, construct: "model heterogeneity (mechanism: error independence)", item: "other-vendor vs same-vendor Auditor", registered: H3, note: "re-frames the registered H3 rationale, 'a different model family brings more diverse knowledge'; not a new prediction; check B3 splits it by Doer vendor and is reported beside the pooled estimate"}
      - {id: HP5, construct: "adding an Auditor x task difficulty (HP1 x HP3)", item: "any Auditor x goal", registered: "H5 (sign flipped)"}
      - {id: none, construct: "task cost", item: "every contrast above, on tokens and US dollars", registered: H7}
    without_flagged_doers: every estimate is also reported without DeepSeek Flash and DeepSeek V4-Pro (amendment no. 4)
    cost_effectiveness:   # Part 5; exploratory, no verdict; reported beside the registered H7 measures
      per_contrast: "the drop in factual-hallucination points per US dollar and per 1,000 tokens of added cost per run; given only where the cost rises and its 95% interval excludes 0"
      per_configuration: "the configurations that no other configuration beats on both mean factual rate and mean US dollars per run"
    robustness:   # Part 1, item 4; every check that ran is reported
      set_a: "the registered checks of section 12, read out from results.json, not refitted"
      set_b: ["B1: a fractional multinomial logit on each list's three shares, compliant as the base, clustered by mini-track", "B2: misplaced citations matched to a proceedings paper left out of each list's base", "B3: the cross-vendor Auditor contrast within each Doer vendor, on the constructs, tokens and US dollars"]
