# ---------------------------------------------------------------------------------------------------------------
# 5. Extension directions (each with scope conditions and the Level 1 fields to vary)
# ---------------------------------------------------------------------------------------------------------------
extension_directions:
  - id: EXT1
    direction: give the Auditor, the Doer or both a search tool
    implied_by: every review effect here is bounded by what a reviewer can recall (P4); a tool separates knowing from checking
    vary_in_level1: [actors_and_information_flows.tools, actors_and_information_flows.retrieval_sources]
    scope: leaves the boundary condition (motivations.boundary_condition); fabrication then measures tool use and trust in results, not recall
  - id: EXT2
    direction: put a human, or a human with an agent, in the Auditor role
    implied_by: the review contrasts and realized_false_rejection measure how much a checker adds and how often it removes good work, the core questions of reliance and override (Cluster 2)
    vary_in_level1: [actors_and_information_flows.actors.auditor]
    scope: needs consent for open data to stay eligible for agent-accessible release
  - id: EXT3
    direction: choose the cheapest configuration that meets an error target
    implied_by: H7 puts every contrast on a cost basis, so the effects can feed a budgeted choice of where to place the stronger model (Lead, Doer or Auditor); the exploratory cost-effectiveness measure of amendment no. 6 is a first step
    vary_in_level1: [study_type_and_design_logic.factors_api_hosted, spending]
    scope: valid for the price file and model versions of the run; prices and models change
  - id: EXT4
    direction: other fields, journal lists and publication windows
    implied_by: the error taxonomy and verifier route are field-neutral, but recall and index coverage are not
    vary_in_level1: [data_provenance.inputs.approved_journals, data_provenance.inputs.local_record_copy, key_parameters.workflow_settings.year_min, key_parameters.workflow_settings.year_max]
    scope: needs a frozen local record copy for the new list and a check of poorly indexed venues
  - id: EXT5
    direction: prompt-wording sensitivity
    implied_by: one wording per condition is a stated limit
    vary_in_level1: [key_parameters.prompts]
    scope: reworded prompts must keep the same requirement text in different words, drafted at the same time as the original
  - id: EXT6
    direction: run-to-run tolerance for the review hypotheses
    implied_by: the API-hosted review tolerance is not measured
    vary_in_level1: [agent_experiment.stochastic_variation]
    scope: repeat reviewed runs on the same drafts
  - id: EXT7
    direction: the same design on later model versions
    implied_by: results hold for the logged access dates; the Level 1 file and the tolerance give a comparison rule for drift over time
    vary_in_level1: [agent_experiment.models]
    scope: compare within the registered tolerance; exact duplication is not expected
  - id: EXT8
    direction: thinking or reasoning turned on
    implied_by: thinking was off in every role; reasoning may change both recall and checking
    vary_in_level1: [agent_experiment.models]
    scope: changes cost and output length; output limits must be re-set
  - id: EXT9
    direction: the paper format as a factor
    implied_by: in pilot stage 2, dropping the full-reference entry raised fabrication sharply, so format is a strong lever in its own right
    vary_in_level1: [study_type_and_design_logic.held_fixed.paper_format, key_parameters.prompts]
    scope: each format needs a same-time control and its own manipulation check
  - id: EXT10
    direction: open-weight models above the recall floor
    implied_by: the open-weight arm sat at the fabrication ceiling, so its contrasts had no room to move
    vary_in_level1: [agent_experiment.models]
    scope: pick models whose pilot fabrication is clearly below the ceiling, under the same provider rule
  - id: EXT11
    direction: cross-vendor review with more than two vendors and Doers of similar recall
    implied_by: "H3 is supported with all Doers and opposite without the flagged Doers, where a cross-vendor Auditor is always a DeepSeek model on a Claude draft; with two vendors, family diversity cannot be separated from the partner family's recall (P5, P6)"
    vary_in_level1: [agent_experiment.models, study_type_and_design_logic.factors_api_hosted.review]
    scope: needs a third vendor whose models pass the same provider rule and pilot gates
  - id: EXT12
    direction: other information retrieval tasks
    implied_by: literature search is how this study operationalises information retrieval (motivations.operationalisation); the workflow levers and the factual and faithful split are not specific to references, but recall and the outside record are
    vary_in_level1: [data_provenance.inputs, key_parameters.prompts]
    scope: needs an outside record that can check every retrieved item, and constraints stated in the task prompt that define faithful hallucination for that task

open_items:
  - sources for the positioning entries, the construct terms and the information-retrieval framing are given in the manuscript
  - the anonymous links for the registration, code and data (on hold until the authors restart the anonymity setup)
